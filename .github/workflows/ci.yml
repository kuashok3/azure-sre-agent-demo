# Pull-request / main-branch checks. No Azure access needed (deployment comes in M11).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: orders
          POSTGRES_USER: orders
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U orders -d orders"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      ENVIRONMENT: test
      DB_HOST: localhost
      DB_PORT: "5434"
      DB_NAME: orders
      DB_USER: orders
      DB_PASSWORD: ci-only-password
      DB_SSLMODE: disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Unit tests
        run: pytest -m "not integration"
      - name: Migrate database
        run: python -m app.orders.migrate
      - name: Integration tests
        run: pytest -m integration

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build container image
        run: docker build --build-arg GIT_SHA=${{ github.sha }} -t sre-demo-app:ci .
